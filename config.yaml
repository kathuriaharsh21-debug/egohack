# EgoHack Configuration
demo_clips: []

# Development clips
dev_clips:
  - MTL-SGF00106-036
  - MTL-SKL00089-008
  - mytronlabs-000003-013
  - mytronlabs-000060-008

data:
  clips_dir: "data/clips"
  weights_dir: "weights"
  out_dir: "out"
models:
  hand_landmarker: "weights/hand_landmarker.task"
  confidence_threshold: 0.5

objects:
  model: "yolov8s-worldv2.pt"
  confidence_threshold: 0.10
  crop_confidence_threshold: 0.06
  hand_object_iou_threshold: 0.6
  ignore_classes:
    - "water bottle"
    - "bottle"
    - "phone"
    - "shelf"
    - "box on floor"
    - "floor box"
    - "gloves"
  scenes:
    SKL:
      classes:
        - "green tube"
        - "wire"
        - "circuit board"
        - "tape dispenser"
        - "tool"
        - "held workpiece"
        - "component"
      fixed_classes: []
    "000003":
      classes:
        - "gemstone"
        - "polishing tool"
        - "metal clamp"
        - "small metal part"
        - "grinding wheel"
        - "held workpiece"
      fixed_classes:
        - "grinding wheel"
    "000060":
      classes:
        - "cloth"
        - "stone slab"
        - "roller"
        - "conveyor"
        - "held workpiece"
      fixed_classes:
        - "conveyor"
    SGF:
      classes:
        - "power planer"
        - "wood plank"
        - "drill"
        - "saw"
        - "tool"
        - "held workpiece"
      fixed_classes: []
    default:
      classes:
        - "tool"
        - "part"
        - "held workpiece"
        - "component"
        - "box"
        - "machine"
        - "table"
      fixed_classes:
        - "machine"
        - "table"
  contact:
    fingertip_indices: [4, 8, 12, 16, 20]
    min_fingertips: 1
    expansion_ratio: 0.22
    min_held_frames: 2
    min_hand_obj_iou: 0.05

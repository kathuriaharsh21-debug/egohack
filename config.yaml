# EgoHack Configuration
demo_clips: []

# Development clips (active clips in data/clips)
dev_clips:
  - MTL-SGF00106-036
  - MTL-SKL00089-008
  - mytronlabs-000003-013
  - mytronlabs-000060-008

data:
  clips_dir: "C:/egohack_data/all_clips"
  clips_480p_dir: "C:/egohack_data/clips_480p"
  weights_dir: "weights"
  out_dir: "out"

models:
  hand_landmarker: "weights/hand_landmarker.task"
  confidence_threshold: 0.5

objects:
  model: "yolov8s-worldv2.pt"
  classes:
    - wrench
    - screwdriver
    - drill
    - pliers
    - hammer
    - box
    - bin
    - bottle
    - cable
    - part
    - tray
    - bag
    - table
    - shelf
    - machine
    - conveyor
    - gloves
    - cloth
    - wood plank
    - power tool
    - tool
    - stone slab
  confidence_threshold: 0.15
  crop_confidence_threshold: 0.08
  hand_object_iou_threshold: 0.6
  fixed_classes:
    - conveyor
    - table
    - shelf
    - machine
  contact:
    fingertip_indices: [4, 8, 12, 16, 20]
    min_fingertips: 2
    expansion_ratio: 0.15
    min_held_frames: 3
